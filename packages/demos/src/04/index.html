<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo 04 - Per-Mip Upload + lodMinClamp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; }
    webgpu-canvas { display: block; width: 100%; height: 100%; }
    #controls {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    button {
      padding: 8px 20px; background: #222; color: #ddd; border: 1px solid #555;
      border-radius: 4px; font: 13px monospace; cursor: pointer;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <webgpu-canvas id="canvas"></webgpu-canvas>
  <div id="controls">
    <button id="btn-prev">◀ Грубее</button>
    <button id="btn-next">▶ Следующий мип</button>
    <button id="btn-auto">⏵ Авто-поток</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
