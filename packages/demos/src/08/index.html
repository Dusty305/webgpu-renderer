<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo 08 - LRU Eviction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; }
    webgpu-canvas { display: block; width: 100%; height: 100%; }
    #heatmap {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; gap: 2px; z-index: 10;
      width: 380px; justify-content: center;
    }
    .cell {
      width: 18px; height: 18px; border-radius: 2px;
      border: 1px solid #333; font: 9px monospace;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: bold;
    }
  </style>
</head>
<body>
  <webgpu-canvas id="canvas"></webgpu-canvas>
  <div id="heatmap"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
